name: 'リリースパッケージ公開 (Release Package)'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: '共通リリース処理実行 (Execute Base Release)'
    uses: masanori-satake/common-workflows/.github/workflows/base-release.yml@v1
    permissions:
      contents: write
    # npm run build (= アイコン生成 → バージョン整合性 → create_package.py) が releases/*.zip を生成。
    # requirements.txt に playwright を含むため base 側で chromium が導入される。
    # create_package.py は GITHUB_REF のタグからバージョンを検証する。
