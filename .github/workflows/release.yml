name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract tag version and verify consistency
        id: verify_version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${TAG_VERSION}" >> $GITHUB_ENV
          python3 -c "
          import json, sys
          with open('projects/app/version.json', 'r') as f:
              ver = json.load(f)['version']
          if ver != '${TAG_VERSION}':
              print(f'Error: Tag version (${TAG_VERSION}) does not match projects/app/version.json ({ver})')
              sys.exit(1)
          print(f'Version match verified: {ver}')
          "

      - name: Build extension package
        run: python3 scripts/create_package.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: FlexPaste-Solo v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: releases/FlexPaste-Solo-v${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
