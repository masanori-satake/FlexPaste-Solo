name: 'リリース: 拡張機能パッケージの公開 (Release: Publish Extension Packages)'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get checked-out commit SHA
        id: get_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps

      - name: Install Playwright for icon generation
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Build packages
        env:
          EXPECTED_VERSION: ${{ github.event.inputs.tag_name }}
        run: npm run build

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          target_commitish: ${{ steps.get_sha.outputs.sha }}
          generate_release_notes: true
          files: releases/*.zip
